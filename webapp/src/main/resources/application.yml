spring:
  application:
    name: product-management-application
  
  # Database Configuration - Easy switch between H2 and other DBs
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Defer SQL initialization until after Hibernate creates the schema
    defer-datasource-initialization: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT Configuration
jwt:
  secret: TQYyf9P-EwcjxuAW-54kMncCimM9s-ntbxQKk
  access-token-validity: 900000  # 15 minutes
  refresh-token-validity: 86400000  # 24 hours

# Server Configuration
server:
  port: 8080

